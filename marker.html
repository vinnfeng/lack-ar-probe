<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiro 标记 · 全屏显示</title>
<style>
  html, body { margin:0; padding:0; background:#fff; min-height:100%; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center;
         min-height:100vh; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  img { width:min(88vmin, 720px); height:auto; display:block; }
  p { color:#333; font-size:16px; line-height:1.6; text-align:center; margin:18px 20px 8px; max-width:640px; }
  p.small { font-size:13px; color:#777; margin-top:2px; }
</style>
</head>
<body>
  <!-- Hiro 标记图：与 index.html 中 patt.hiro 图案文件对应的是同一个标记 -->
  <img src="hiro.png" alt="Hiro 标记">
  <p>把这个标记全屏显示在电脑屏幕上，或打印在 A4 纸上，手机打开 AR 页对着它。</p>
  <p class="small">注意：标记的黑色边框要完整出现在手机画面里，纸张保持平整、不要反光；标记实际边长约 16cm 时，AR 里的桌子就是真实大小（55cm）。</p>
</body>
</html>
